<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SC Hub">
  <meta name="theme-color" content="#111111">
  <title>SoulCycle Instructor Hub</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #111111;
      overflow: hidden;
    }
    #frame {
      position: fixed;
      /* Account for iOS safe areas (notch, home indicator) */
      top: env(safe-area-inset-top, 0px);
      left: env(safe-area-inset-left, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      width: 100%;
      height: 100%;
      border: none;
    }
    /* Splash shown while iframe loads */
    #splash {
      position: fixed; inset: 0;
      background: #111111;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-wordmark {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 22px; font-weight: 900;
      letter-spacing: 6px; text-transform: uppercase;
      color: #FEDD00;
    }
    .splash-sub {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 11px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      color: #555555;
    }
    .splash-spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid #333333;
      border-top-color: #FEDD00;
      animation: spin 0.8s linear infinite;
      margin-top: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="splash">
    <div class="splash-wordmark">SOULCYCLE</div>
    <div class="splash-sub">Instructor Hub</div>
    <div class="splash-spinner"></div>
  </div>

  <iframe
    id="frame"
    src="https://script.google.com/a/macros/soul-cycle.com/s/AKfycbw_ZhFH3Y7_OuB8cwHwM09u3OkwlNd_L6Mmmozav6EeJyuZ4giNQr7umL-TI6bA78F5/exec"
    allow="camera; microphone"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation"
  ></iframe>

  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function(e) {
        console.warn('SW registration failed:', e);
      });
    }

    // Hide splash once iframe loads
    var frame = document.getElementById('frame');
    var splash = document.getElementById('splash');
    frame.addEventListener('load', function() {
      splash.classList.add('hidden');
      setTimeout(function() { splash.style.display = 'none'; }, 400);
    });
    // Safety fallback — hide splash after 8s regardless
    setTimeout(function() {
      splash.classList.add('hidden');
      setTimeout(function() { splash.style.display = 'none'; }, 400);
    }, 8000);
  </script>

</body>
</html>
