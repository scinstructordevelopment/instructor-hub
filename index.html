<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SC Hub">
  <meta name="theme-color" content="#111111">
  <title>SoulCycle Instructor Hub</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #111111;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
    }
    .wordmark {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 22px; font-weight: 900;
      letter-spacing: 6px; text-transform: uppercase;
      color: #FEDD00;
    }
    .sub {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 11px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      color: #555555;
    }
    .spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid #333333;
      border-top-color: #FEDD00;
      animation: spin 0.8s linear infinite;
      margin-top: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wordmark">SOULCYCLE</div>
  <div class="sub">Instructor Hub</div>
  <div class="spinner"></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/instructor-hub/sw.js').catch(function(e) {
        console.warn('SW registration failed:', e);
      });
    }
    // Redirect to the Apps Script app in the same window
    setTimeout(function() {
      window.location.replace('https://script.google.com/a/macros/soul-cycle.com/s/AKfycbw_ZhFH3Y7_OuB8cwHwM09u3OkwlNd_L6Mmmozav6EeJyuZ4giNQr7umL-TI6bA78F5/exec');
    }, 1200);
  </script>
</body>
</html>
